services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campusfix
      POSTGRES_USER: campusfix
      POSTGRES_PASSWORD: local_only_change_me
    volumes: [campusfix_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusfix -d campusfix"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://campusfix:local_only_change_me@db:5432/campusfix
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
    volumes: [./backend/uploads:/app/uploads]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  campusfix_pg:
